name: Docs check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Relative links and study-hub nav
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Markdown links, anchors and index.html nav entries
        run: python3 tools/check_links.py
      - name: Check data/questions.json is up to date with the guides
        run: python3 tools/build_question_bank.py --check
